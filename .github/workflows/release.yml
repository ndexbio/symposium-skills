name: release

# One job per skill, selected by its own tag prefix, so each skill in this
# repository releases independently. To add a skill, copy the job below and
# change the name, the tag prefix and the directory.
#
# The tag carries the version, and the build stamps it into the zip's name and
# into the skill's frontmatter — so nothing in the repository has to be kept in
# step with it. Each job attaches <skill>/dist/<skill>_skill-<version>.zip.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  symposium-curate-data:
    if: startsWith(github.event.release.tag_name, 'symposium-curate-data-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the skill, stamped with the tag's version
        run: make -C symposium-curate-data build VERSION="${TAG#symposium-curate-data-v}"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Attach the zip to the release
        run: gh release upload "$TAG" "symposium-curate-data/dist/symposium-curate-data_skill-${TAG#symposium-curate-data-v}.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}

  symposium-evaluate-hypothesis:
    if: startsWith(github.event.release.tag_name, 'symposium-evaluate-hypothesis-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the skill, stamped with the tag's version
        run: make -C symposium-evaluate-hypothesis build VERSION="${TAG#symposium-evaluate-hypothesis-v}"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Attach the zip to the release
        run: gh release upload "$TAG" "symposium-evaluate-hypothesis/dist/symposium-evaluate-hypothesis_skill-${TAG#symposium-evaluate-hypothesis-v}.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
